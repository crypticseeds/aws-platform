# Root app-of-apps. Everything under argocd/apps/ becomes an Argo CD resource.
# Git is the source of truth: a file added there is created, a file removed
# is pruned, and manual changes in the cluster are reverted.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/crypticseeds/aws-platform.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
