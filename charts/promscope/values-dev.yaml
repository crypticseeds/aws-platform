# Dev environment.
#
# image.repository and image.tag are set by the Argo CD Application
# (argocd/workloads/promscope.yaml); rendering fails on purpose without them.
#
# Reach the MCP endpoint locally:
#   kubectl -n <namespace> port-forward svc/promscope 8090:8090
#   then use http://localhost:8090/mcp

serviceMonitor:
  enabled: true
