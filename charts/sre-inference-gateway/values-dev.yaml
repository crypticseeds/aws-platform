# Dev environment. Only the mock providers are enabled: no LLM API keys exist
# anywhere in this deployment.
#
# image.repository and image.tag are set by the Argo CD Application
# (argocd/workloads/sre-inference-gateway.yaml); rendering fails on purpose
# without them.

ingress:
  enabled: true
  groupName: aws-platform-dev
  annotations:
    # Streaming (SSE) responses keep the connection open between chunks. The
    # ALB closes a connection after idle_timeout seconds with no data. The
    # gateway's own request timeout is 35s, so 60s (the ALB default) would be
    # enough today; 120s leaves room for slower real providers later.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
    # Only the owner's IP may reach the ALB. The group is created by
    # envs/dev/gateway-alb.tf and found by its Name tag; the allowed CIDR stays
    # in the git-ignored tfvars, not in this public repo (DEV-164).
    alb.ingress.kubernetes.io/security-groups: aws-platform-dev-gateway-alb
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"

serviceMonitor:
  enabled: true

config:
  providers:
    - name: "mock_openai"
      type: "mock"
      model: "mock-model"
      weight: 0.5
      enabled: true
      health_check_url: null
      timeout: 30.0
      max_retries: 3
      stream_chunk_delay: 0.05
      stream_content_chunks: 3
    - name: "mock_vllm"
      type: "mock"
      model: "mock-model"
      weight: 0.5
      enabled: true
      health_check_url: null
      timeout: 30.0
      max_retries: 3
      stream_chunk_delay: 0.05
      stream_content_chunks: 3
