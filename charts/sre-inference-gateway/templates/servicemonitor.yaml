{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  endpoints:
    # The gateway serves /metrics from its FastAPI app on the API port
    # (app/main.py includes metrics_router; no separate listener starts on
    # config.metrics.port, 9090). Scraping the "metrics" port would show the
    # target as down.
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
