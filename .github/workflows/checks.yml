# Static checks on every pull request and on main. No AWS credentials.
# Blocking (required in branch protection): pre-commit, helm-charts, actionlint.
# Advisory (report to code scanning, never fail on findings): checkov, trivy-sarif, snyk-iac.
# See docs/runbooks/ci.md.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same versions as the owner's local installs.
  TERRAFORM_VERSION: 1.14.7
  TFLINT_VERSION: v0.64.0
  TRIVY_VERSION: v0.75.0
  HELM_VERSION: v3.21.3
  KUBECONFORM_VERSION: v0.8.0
  ACTIONLINT_VERSION: v1.7.12
  PRE_COMMIT_VERSION: 4.6.2
  CHECKOV_VERSION: 3.3.22
  SNYK_VERSION: v1.1307.4
  # EKS version in envs/dev/variables.tf.
  KUBERNETES_VERSION: 1.36.0
  # CRD schemas (ServiceMonitor etc.) from datreeio/CRDs-catalog, pinned to a commit.
  CRD_CATALOG_REF: 4c8dc296d32b06d15ccde9668ff136c951f4d539

jobs:
  pre-commit:
    name: pre-commit (gitleaks, terraform fmt/validate/tflint, trivy, yamllint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Install tflint plugins (.tflint.hcl)
        env:
          # Avoids GitHub API rate limits when downloading the AWS ruleset.
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install "pre-commit==${PRE_COMMIT_VERSION}"
      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure --color always

  helm-charts:
    name: helm-charts (helm lint, kubeconform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: helm lint + helm template (every chart under charts/)
        run: .github/scripts/render-charts.sh rendered
      - name: kubeconform -strict (rendered charts)
        run: |
          crd_schemas="https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_REF}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          for f in rendered/*.yaml; do
            echo "== kubeconform $f"
            kubeconform -strict -summary -output pretty \
              -kubernetes-version "$KUBERNETES_VERSION" \
              -schema-location default -schema-location "$crd_schemas" \
              "$f"
          done

  actionlint:
    name: actionlint (GitHub workflows)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: actionlint
        # shellcheck is preinstalled on the runner; actionlint uses it for run: blocks.
        run: actionlint -color

  checkov:
    name: checkov (advisory, Terraform + rendered charts)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install checkov
        run: pip install "checkov==${CHECKOV_VERSION}"
      - name: Render charts
        run: .github/scripts/render-charts.sh rendered
      - name: checkov (soft-fail, all checks)
        # Advisory: findings never fail the job; a checkov crash still does.
        # Severity filtering (--check HIGH,CRITICAL) needs a Prisma Cloud API key;
        # without one it selects zero checks, so every check runs here.
        # Deliberate exceptions: inline `checkov:skip=<ID>:<reason>` comments.
        # Sensitive inputs have no value in CI, and checkov fails a rule it
        # cannot resolve. The var file gives it a documentation /32 (RFC 5737)
        # so the SG rules are really evaluated: a hard-coded 0.0.0.0/0 still
        # fails. The real owner IP is guarded by variable validation instead.
        run: |
          printf 'endpoint_public_access_cidrs = ["203.0.113.10/32"]\n' > "$RUNNER_TEMP/checkov.tfvars"
          checkov -d bootstrap -d envs/dev -d modules -d rendered \
            --framework terraform kubernetes \
            --var-file "$RUNNER_TEMP/checkov.tfvars" \
            --soft-fail --compact \
            -o cli -o sarif --output-file-path console,checkov.sarif
      - name: Upload checkov SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('checkov.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: checkov.sarif
          category: checkov

  trivy-sarif:
    name: trivy (SARIF report only, the gate is in pre-commit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: trivy config (HIGH,CRITICAL, exit 0)
        run: |
          trivy config --severity HIGH,CRITICAL --skip-dirs '**/.terraform' \
            --format sarif --output trivy.sarif --exit-code 0 .
      - name: Upload trivy SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy

  snyk-iac:
    name: snyk-iac (advisory, Terraform + rendered charts)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Skip notice (no SNYK_TOKEN secret)
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "::notice title=snyk-iac skipped::The SNYK_TOKEN repository secret is not set, so Snyk IaC did not run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ env.SNYK_TOKEN != '' }}
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        if: ${{ env.SNYK_TOKEN != '' }}
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04  # v1.0.0
        if: ${{ env.SNYK_TOKEN != '' }}
        with:
          snyk-version: ${{ env.SNYK_VERSION }}
      - name: Render charts
        if: ${{ env.SNYK_TOKEN != '' }}
        run: .github/scripts/render-charts.sh rendered
      - name: snyk iac test (HIGH,CRITICAL)
        if: ${{ env.SNYK_TOKEN != '' }}
        # Advisory: exit 1 (issues found) passes; 2 (error) and 3 (nothing scanned) fail.
        # The CLI reads SNYK_TOKEN from the environment; it is never printed.
        run: |
          rc=0
          snyk iac test --severity-threshold=high --sarif-file-output=snyk.sarif \
            bootstrap envs/dev modules rendered || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error title=snyk-iac::snyk iac test failed with exit code $rc"
            exit "$rc"
          fi
      - name: Upload Snyk SARIF to code scanning
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' && hashFiles('snyk.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: snyk.sarif
          category: snyk-iac
